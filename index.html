<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Main Character | Run Intention</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #0d0d0d;
            color: #ffffff;
            font-family: 'Plus Jakarta Sans', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 15px 40px;
            min-height: 100vh;
        }
        .header {
            text-align: center;
            margin-bottom: 25px;
            margin-top: 10px;
        }
        .logo {
            max-width: 180px;
            height: auto;
            object-fit: contain;
        }
        .video-container {
            width: 100%;
            max-width: 400px;
            aspect-ratio: 1 / 1;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0px 10px 30px rgba(255, 78, 80, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: #1a1a1a;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .cta-container {
            width: 100%;
            max-width: 400px;
            margin-top: 25px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            border-radius: 50px;
            font-weight: 800;
            font-size: 1rem;
            text-decoration: none;
            letter-spacing: 0.5px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .btn:active { transform: scale(0.98); }
        .btn-insta {
            background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(220, 39, 67, 0.4);
        }
        .btn-wa {
            background: #25D366;
            color: #000000;
            box-shadow: 0 4px 15px rgba(37, 211, 102, 0.4);
        }
    </style>
</head>
<body>

    <div class="header">
        <!-- Make sure your logo image file uploaded on GitHub is named logo.png -->
        <img src="logo.png" alt="Run Intention Logo" class="logo">
    </div>

    <div class="video-container">
        <!-- Make sure your video file uploaded on GitHub is named reward 1.mp4 -->
        <video autoplay loop muted playsinline>
            <source src="reward 1.mp4" type="video/mp4">
            Your browser does not support video.
        </video>
    </div>

    <div class="cta-container">
        <a href="https://www.instagram.com/runintention" class="btn btn-insta" target="_blank">FOLLOW ON INSTAGRAM</a>
        <a href="https://chat.whatsapp.com/ECwUIjy5qSj31hm491NN72" class="btn btn-wa" target="_blank">JOIN WHATSAPP GROUP</a>
    </div>

</body>
</html>
